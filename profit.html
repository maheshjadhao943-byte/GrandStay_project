<!DOCTYPE html>
<html>

<head>

<title>Profit & Loss</title>

<meta name="viewport"
content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="style.css">

</head>

<body class="profit-theme">

<div class="layout">

<aside class="sidebar" id="sidebar"></aside>

<main class="main">

<div class="page-title">

<h1>⚖ Profit & Loss</h1>

<p>Hotel financial performance</p>

</div>

<div class="cards">

<div class="card">

<h3>Total Revenue</h3>

<div class="amount green"
id="revenue">
₹0
</div>

</div>

<div class="card">

<h3>Total Expenses</h3>

<div class="amount red"
id="expenses">
₹0
</div>

</div>

<div class="card">

<h3>Net Profit / Loss</h3>

<div class="amount purple"
id="profit">
₹0
</div>

</div>

</div>

<br>

<div class="table-box">

<h2>Expense Breakdown</h2>

<br>

<table>

<tr>
<th>Expense Category</th>
<th>Amount</th>
</tr>

<tr>
<td>Food & Raw Material</td>
<td id="food">₹0</td>
</tr>

<tr>
<td>Utilities & Rent</td>
<td id="utilities">₹0</td>
</tr>

<tr>
<td>Laundry & Repairs</td>
<td id="laundry">₹0</td>
</tr>

<tr>
<td>Fuel & Gas</td>
<td id="fuel">₹0</td>
</tr>

<tr>
<td>Internet & Misc</td>
<td id="misc">₹0</td>
</tr>

<tr>
<td>Salary & Payroll</td>
<td id="salary">₹0</td>
</tr>

</table>

<div class="summary">

<h2>
Profit Margin:
<span id="margin">0%</span>
</h2>

</div>

</div>

</main>
</div>

<script src="common.js"></script>
<script src="profit.js"></script>

</body>
</html>
